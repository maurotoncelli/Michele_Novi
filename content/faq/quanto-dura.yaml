slug: Quanto dura la visita?
domanda:
  it: Quanto dura la visita?
  en: How long is the visit?
risposta:
  it: Una prima visita dura in genere 30–40 minuti, compresa l'eventuale ecografia in ambulatorio. I controlli sono più brevi.
  en: A first visit usually lasts 30–40 minutes, including ultrasound in clinic if needed. Follow-ups are shorter.
