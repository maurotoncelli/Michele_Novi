slug: Posso operarmi in ospedale pubblico?
domanda:
  it: Posso operarmi in ospedale pubblico?
  en: Can I have surgery in the public hospital?
risposta:
  it: Sì. Molti interventi si fanno a Fucecchio in regime SSN. Il percorso pubblico passa dal medico curante e dal CUP regionale, non dalla mia segreteria; in visita ti spiego come muoverti.
  en: Yes. Many operations are performed in Fucecchio under the NHS. The public pathway goes through your GP and the regional booking centre, not through my office; at the visit I explain how to proceed.
contesto: contatti
peso: 3
