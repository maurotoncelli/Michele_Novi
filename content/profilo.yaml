comeValuto:
  it: >-
    La prima visita può cambiare la strada. Spesso chi arriva con una diagnosi di "protesi" può essere curato
    in altro modo, e chi ha rimandato per anni scopre che l'intervento è più semplice di quanto temeva.
    Guardo le immagini insieme a te, ti spiego cosa vedo e cosa non vedo, e decidiamo il percorso.
  en: >-
    The first visit can change the path. Often someone who arrives with a "replacement" diagnosis can be
    treated another way, and someone who has postponed for years finds surgery is simpler than feared.
    We look at the images together, I explain what I see and what I do not, and we decide the path.
territorio:
  it: >-
    In Valdera partecipo a iniziative di prevenzione e screening ortopedico per il territorio, e tengo lezioni
    e corsi per colleghi e fisioterapisti.
  en: >-
    In the Valdera area I take part in prevention and orthopaedic screening initiatives for the community,
    and I teach courses for colleagues and physiotherapists.
