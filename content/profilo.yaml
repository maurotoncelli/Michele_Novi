nome: Michele Novi
titolo:
  it: Ortopedico e traumatologo. Chirurgia della spalla, del gomito e dell'arto superiore.
  en: Orthopaedic and trauma surgeon. Shoulder, elbow and upper-limb surgery.
apertura:
  it: >-
    Sono dirigente medico della SOC Ortopedia Protesica dell'Ospedale San Pietro Igneo di Fucecchio e visito
    in libera professione a Pisa e a Peccioli. Mi occupo di chirurgia artroscopica, protesica e traumatologica
    dell'arto superiore, con la spalla al centro. Alla prima visita cerco di capire una cosa sola: qual è la
    strada giusta per quella persona, non quale intervento si può fare.
  en: >-
    I am a consultant in the Joint Replacement Unit at San Pietro Igneo Hospital in Fucecchio and see patients
    privately in Pisa and Peccioli. My work is arthroscopic, joint-replacement and trauma surgery of the upper
    limb, with the shoulder at its centre. At the first visit I try to understand one thing only: which path is
    right for that person, not which operation could be done.
