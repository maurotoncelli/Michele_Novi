riassunto:
  it: 'Quando la spalla si lussa più volte, la testa dell''omero può avere un''impronta ossea (Hill-Sachs) che favorisce nuove lussazioni. Il remplissage ''riempie'' quel difetto con il tendine, in artroscopia, insieme alla riparazione del labbro. Negli atleti seguiti la recidiva è stata assente e la perdita di rotazione esterna minima.'
  en: 'When the shoulder dislocates repeatedly, the humeral head can carry a bony dent (Hill-Sachs) that favours new dislocations. Remplissage ''fills'' that defect with tendon, arthroscopically, together with labral repair. In the athletes followed, recurrence was absent and loss of external rotation minimal.'
