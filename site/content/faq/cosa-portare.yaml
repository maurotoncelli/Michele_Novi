slug: Cosa devo portare alla prima visita?
domanda:
  it: Cosa devo portare alla prima visita?
  en: What should I bring to the first visit?
risposta:
  it: Le immagini che hai già (radiografie, risonanza, TC) su CD/DVD o con il codice per scaricarle, i referti precedenti e l'elenco dei farmaci che prendi. Vieni con abiti comodi che lascino scoperta la spalla o il braccio.
  en: Any images you already have (X-rays, MRI, CT) on disc or with the download code, previous reports and the list of medicines you take. Wear comfortable clothes that leave the shoulder or arm easy to expose.
contesto: contatti
peso: 1
