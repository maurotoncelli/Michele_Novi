slug: Fate infiltrazioni?
domanda:
  it: Fate infiltrazioni?
  en: Do you perform injections?
risposta:
  it: Sì, in tutte le sedi in cui visito, quando sono indicate. Sono eco-guidate, per essere sicuri di raggiungere il punto giusto.
  en: Yes, at every location where I see patients, when indicated. They are ultrasound-guided, to be sure of reaching the right spot.
