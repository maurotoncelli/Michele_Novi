slug: Quanto costa la visita?
domanda:
  it: Quanto costa la visita?
  en: How much does the visit cost?
risposta:
  it: Il costo della visita privata lo comunica la segreteria al momento della prenotazione. I ricoveri e gli interventi in ospedale pubblico (Fucecchio) seguono il Servizio Sanitario Nazionale e non hanno costi per il paziente.
  en: The office tells you the cost of a private visit when you book. Admissions and operations in the public hospital (Fucecchio) follow the National Health Service and have no cost for the patient.
contesto: contatti
peso: 2
