  it: Spalla e arto superiore.
  en: Shoulder and upper limb.
sottotitolo:
  it: Chirurgo ortopedico. Visito a Fucecchio, Pisa e Peccioli; opero a Fucecchio, Pisa e Sesto Fiorentino. La prima visita serve a decidere la strada, non l'intervento.
  en: Orthopaedic surgeon. I see patients in Fucecchio, Pisa and Peccioli; I operate in Fucecchio, Pisa and Sesto Fiorentino. The first visit is for deciding the path, not the operation.
