sottotitolo:
  it: |-
    Chirurgia della spalla, trattamento delle patologie complesse e chirurgia ricostruttiva.
    Mi occupo del trattamento chirurgico delle patologie della Spalla e dell'Arto Superiore, sia degenerative che traumatiche e sportive, con particolare attenzione alle condizioni complesse della cuffia dei rotatori, di instabilità articolare e alle procedure ricostruttive avanzate.
    Svolgo inoltre attività chirurgica nell'ambito della patologia Ortopedica del ginocchio e dell'Anca. Formazione ed esperienza professionale maturate tra l'Italia e i centri internazionali.
  en: |-
    Shoulder surgery, treatment of complex conditions and reconstructive surgery.
    I treat degenerative, traumatic and sports-related conditions of the Shoulder and Upper Limb, with a focus on complex rotator cuff pathology, joint instability and advanced reconstructive procedures.
    I also perform orthopaedic surgery of the Knee and Hip. Training and professional experience gained in Italy and at international centres.
