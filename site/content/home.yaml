sottotitolo:
  it: |-
    Chirurgia della Spalla e Arto Superiore.
    Chirurgia ricostruttiva Artroscopica e Protesica

    Da sempre mi occupo del trattamento delle patologie della Spalla e dell'Arto Superiore, sia degenerative che traumatiche e sportive, con particolare attenzione alla chirurgia ricostruttiva anche per patologie complesse della cuffia dei rotatori, dell'instabilità articolare e degli esiti di frattura.

    Svolgo inoltre attività chirurgica nell'ambito della patologia ortopedica del Ginocchio e dell'Anca. Formazione ed esperienza professionale maturate tra l'Italia e i migliori centri internazionali.
  en: |-
    Shoulder and Upper Limb Surgery.
    Arthroscopic Reconstructive and Joint Replacement Surgery

    I have always been dedicated to the treatment of Shoulder and Upper Limb conditions — degenerative, traumatic and sports-related — with a focus on reconstructive surgery, including complex rotator cuff tears, joint instability and fracture sequelae.

    I also perform orthopaedic surgery of the Knee and Hip. Training and professional experience gained in Italy and at leading international centres.
