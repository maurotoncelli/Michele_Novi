titolo:
  it: Dott. Michele Novi
  en: Dr Michele Novi
sottotitolo:
  it: |-
    Chirurgia della spalla, del gomito e dell'arto superiore.
    Dirigente medico in ospedale pubblico e formatosi tra Berlino, Seattle e Boston (Harvard), si occupa di patologie dei tendini, instabilità, artrosi e fratture. Dalla diagnosi in visita con ecografia fino all'artroscopia e alla protesi, quando servono davvero.
  en: |-
    Shoulder, elbow and upper-limb surgery.
    Public hospital consultant trained in Berlin, Seattle and Boston (Harvard), treating tendon conditions, instability, arthritis and fractures. From in-office ultrasound diagnosis to arthroscopy and joint replacement, when truly needed.
