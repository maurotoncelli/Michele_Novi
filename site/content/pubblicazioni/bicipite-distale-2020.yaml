slug: 'Reinsertion of distal biceps ruptures with a single anterior approach: analysis of 14 cases using tension-slide technique and interference screw'
titolo: 'Reinsertion of distal biceps ruptures with a single anterior approach: analysis of 14 cases using tension-slide technique and interference screw'
titoloBreve:
  it: 'Reinserzione del bicipite distale con un solo accesso anteriore'
  en: 'Distal biceps reinsertion through a single anterior approach'
autori: 'Micheloni GM, Tarallo L, Porcellini G, Novi M, Catani F'
rivista: 'Acta Biomedica'
anno: 2020
volume: '91(4-S):183–188'
