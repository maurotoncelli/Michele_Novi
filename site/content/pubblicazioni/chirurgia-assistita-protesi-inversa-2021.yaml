slug: 'Computer-Assisted Surgery in Reverse Shoulder Arthroplasty: Early Experience'
titolo: 'Computer-Assisted Surgery in Reverse Shoulder Arthroplasty: Early Experience'
titoloBreve:
  it: 'Chirurgia assistita dal computer nella protesi inversa di spalla'
  en: 'Computer-assisted surgery in reverse shoulder replacement'
autori: 'Andrea Giorgini, Luigi Tarallo, Michele Novi, Giuseppe Porcellini'
rivista: 'Indian Journal of Orthopaedics'
anno: 2021
volume: '55(4):1003–1008'
doi: '10.1007/s43465-020-00344-8'
