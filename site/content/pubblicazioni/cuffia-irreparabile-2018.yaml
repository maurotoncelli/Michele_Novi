testoIntegrale: |
  ## Abstract

  Irreparable rotator cuff tears are common conditions seen by shoulder surgeons, characterized by a torn and retracted tendon associated with muscle atrophy and impaired mobility. Direct fixation of the torn tendon is not possible due to the retracted tendon and lack of healing potential which result in poor outcome. Several treatment options are viable but correct indication is mandatory for a good result, pain improvement, and restoration of shoulder function. Patient can be treated either with a conservative program or surgically when necessary, by different available modalities like arthroscopic debridement, partial reconstruction, subacromial spacer, tendon transfer, and shoulder replacement with reverse prosthesis. The aim of this study was to review literature to give an overview of the available possible solutions, with indications and expected outcomes. Keywords: irreparable rotator cuff tear, arthroscopy, partial repair, tendon transfer, graft augmentation

  ## Introduction

  Rotator cuff tears (RCTs) represent one of the most frequent pathologic conditions of the shoulder, with a higher incidence in patients over 50 years and a progressive pattern in most of the cases.{% sup %}1{% /sup %}

  Surgical treatment for symptomatic cases provides direct reattachment of the torn tendon to the humeral footprint; however, it cannot be achieved when progression of RCT develops into an irreparable condition.

  The term “irreparable” is often incorrectly used and interchanged with the term massive; while most irreparable RCTs can also be considered massive tears, not all massive tears are indeed irreparable.{% sup %}2{% /sup %} RCTs are defined as irreparable when the lesions cannot be repaired primarily to their insertion on the tuberosities despite conventional techniques of surgical release/mobilization, because of their size, retraction, and muscle impairment caused by atrophy and fatty infiltration.{% sup %}3,4{% /sup %}

  For posterosuperior RCTs, Gerber et al considered the tear as irreparable when it was impossible to achieve fixation of torn tendons in <60° of abduction despite adequate releases.{% sup %}5{% /sup %}

  Clinical aspects of an irreparable RCT include long duration of symptoms, weakness in external rotation, reduction of acromiohumeral distance <6 mm on a true anteroposterior X-ray, torn tendon with retraction to the glenoid (stage 3 of Patte classification), and fatty infiltration of the rotator cuff muscles >50%.6

  These factors correlate with a high probability that the tendons will not heal even if mobilization and repair are feasible. So, irreparable lesions are considered to be those that have low healing potential, and those wherein standard surgical approaches for RCT are not successful.

  Literature reports of retear rates in massive posterosuperior rotator cuff repair range from 40% to 91%.7–9 Anterosuperior RCTs, more specifically subscapularis (SSc) tears, are less common than the posterosuperior RCTs.{% sup %}10,11{% /sup %}

  The purpose of this paper was to review literature to give an overview of the currently available solutions, with indications and expected outcomes for irreparable RCTs. This manuscript is not a systemic review and draws from the clinical experience of the authors and with the current literature evidence on this topic.

  ## Conservative treatment

  A massive RCT has been historically reported as a tear with a diameter of ≥5 cm or as a complete tear of two or more tendons. A recent classification of massive tears described five types: type A, supraspinatus and superior SSc tears; type B, supraspinatus and entire SSc tears; type C, supraspinatus, superior SSc, and infraspinatus tears; type D, supraspinatus and infraspinatus tears; and type E, supraspinatus, infraspinatus, and teres minor tears. This classification not only subclassifies massive tears but has also been linked to function, particularly the maintenance of active elevation. The limit between massive and irreparable tears is often “transient.”{% sup %}7–11{% /sup %} Irreparable cuff tear in low-demanding patients can be treated conservatively with the aim of improving pain, and full or partial recovery of the shoulder motion. Patients should follow a rehabilitation program, taking medication and physical therapy to reduce pain and subacromial injections with steroids, hyaluronic acid, or platelet-rich plasma. In some patients this treatment is effective, although it is possible that the attenuation or the disappearance of pain is simply due to rest and/or the natural history of the cuff tear.{% sup %}12{% /sup %}

  Good results with physical therapy for patients with irreparable RCTs are reported in the literature. Ainsworth evaluated a multimodal 12-week physical therapy program that emphasized on patient education, posture correction, re-education of muscle recruitment, strengthening, stretching, improved proprioception, and adaptation.{% sup %}13{% /sup %} Authors have reported nine points of improving on the Oxford Shoulder Score and 22 points of improving on the Short Form-36 score.

  Exercises for strengthening anterior deltoid help in achieving shoulder elevation even in patients who originally present with pseudoparalytic shoulder (elevation below 90°). A 9-month prospective study by Levy et al in 17 patients with a diagnosis of irreparable RCTs treated with an anterior deltoid training program, continued for 12 weeks, showed a mean constant score (CS) improvement from 26 to 63, and a forward flexion improvement from 40° to 160°.14

  Even other authors have concluded that nonoperatively treated massive RCTs in moderately symptomatic patients can maintain satisfactory shoulder function despite the progression of degenerative pathology.{% sup %}15{% /sup %}

  ## Arthroscopic debridement

  Arthroscopic procedures in irreparable RCTs are effective at alleviating pain, but have little effect on strength.{% sup %}6{% /sup %}

  The subacromial bursa contains inflammatory cytokines correlated with algogenic effect. Chronic inflammatory infiltrate, such as synovial-like cells, lymphocytes, macrophages, plasmacytes, young fibrocytes, and sometimes dystrophic calcifications are presents in the tear margins.{% sup %}16{% /sup %}

  Therefore, bursectomy and debridement of tear margins may determine pain decrease.

  Acromioplasty, subacromial decompression, and debridement of massive infraspinatus and supraspinatus tears reported good results in the literature with an improvement of mobility, pain, and clinical scores.{% sup %}17,18{% /sup %}

  Acromioplasty is, however, a less appealing procedure in arthroscopic debridement because inevitably it causes the disruption of the coracoacromial ligament and is therefore an incentive for humeral head escape.{% sup %}18{% /sup %}

  A retrospective study by Liem et al{% sup %}19{% /sup %} assessed 31 patients after arthroscopic debridement of an irreparable RCT with a mean follow-up of 4 years. They observed that the mean American Shoulder and Elbow Surgeons (ASES) score significantly improved from 24 points preoperatively to 70 points at follow-up. Scores for pain were reduced from 8 to 3 points on a visual analog scale ranging from 0 to 10. Several studies showed that this is a viable option in the elderly and low-demand patients, even if it does not slow the progression of osteoarthritis.{% sup %}20{% /sup %} However, satisfactory results are most likely to be achieved in the elderly and low-demanding patients seeking primarily pain relief and in patients with a preserved deltoid function and intact posterior cuff.

  ## Long head biceps tendon tenotomy

  Patients with a massive cuff tear usually have a degenerated, frayed, and flattened biceps tendon. Clinical presentation is often intense anterior pain with positive tests for biceps tendinitis. Walch et al observed that many patients with chronic RCTs had pain relief after spontaneous rupture of the biceps tendon.{% sup %}21{% /sup %}

  Tenotomy may be performed close to the origin on the glenoid to avoid impingement of the stump with the glenohumeral articulation. Moreover, the flattened part of the tendon is flattened stucks at the entrance of the bicipital groove without causing the Popeye deformity.

  Other authors report that additional tenotomy of the long head biceps tendon during arthroscopic debridement did not significantly influence the postoperative results at long-term follow-up.{% sup %}22,23{% /sup %}

  ## Suprascapular nerve (SSN) release

  In cases of RCT associated with SSN neuropathy and related positive clinical and electromyography (EMG) signs, surgical nerve release is increasingly performed.

  SSN neuropathy seems to be associated with pain and weakness in massive RCTs, but its pathogenesis is not fully understood.

  Some articles show different results, like the prospective study of Collin et al in 2014, where the authors founded a low association of neuropathy with massive RCT.{% sup %}24{% /sup %}

  A possible explanation of SSN neuropathy is that massive posterosuperior cuff tears can place traction on the SSN as the rotator cuff muscles retract. Some authors reported abnormal nerve conduction studies, in patients with fatty infiltration and tendon retraction (Patte stage 3).{% sup %}25{% /sup %} Some of these studies also documented partial or complete recovery following partial or complete repair.

  It is possible that nerve entrapment is caused by a possible adhesion related to the scar tissue of the tear and fatty infiltration, with an abnormal traction by the pathologic stump of the tendon.

  Magnetic resonance imaging (MRI) is the preferred modality to evaluate atrophy of the cuff muscles as well as to assess potential causes of SSN compression. EMG and nerve conduction velocity studies remain the gold standard for formulation of the diagnosis of suprascapular neuropathy.{% sup %}26{% /sup %}

  The first-line treatment is usually conservative,27 consisting of rest, physical therapy, and anti-inflammatory drugs. Surgical treatment is considered for patients with nerve compression by an external source or for symptoms refractory to conservative measures.

  ## Tuberoplasty

  Fenlin et al{% sup %}28{% /sup %} introduced in 2002 a new surgical open procedure described as tuberoplasty, modified by Scheibel et al{% sup %}29{% /sup %} 2 years later with an arthroscopic approach called “reversed subacromial decompression.”

  It involves removing the exuberant lateral margin of the greater tuberosity to create a smooth congruent acromiohumeral articulation and preserving the integrity of the coracoacromial arch.

  Significant improvement in pain, activities of daily living, and range of motion are reported, and an increase of age-adjusted CS from 65.9% to 90.6%, with a mean follow-up of 40 months. A progression of osteoarthritis was observed by the authors, although it did not interfere with the clinical result.

  ## Subacromial biodegradable spacer

  The subacromial spacer is a biodegradable balloon (Ortho-Space, Kfar Saba, Israel) made of poly-L-lactide, arthroscopically implanted between the acromion and the humeral head, and inflated with saline solution. It is derived from general surgery devices, used on top of the massive cuff tear, and its presence reduces subacromial friction during shoulder abduction by lowering the head of the humerus and facilitating humeral gliding against the acromion.

  Debridement and bursectomy are performed to define the dimension of the RCT and measure the correct size (Figure 1A and B). The InSpace subacromial spacer is available in three different sizes: small (40×50 mm), medium (50×60 mm), and large (60×70 mm).

  The spacer deflates in ~10 weeks and completely degrades within 15 months,30 a sufficient period of time to perform physiotherapy program. It is not clear why pain and functional scores continue to improve beyond the period of spacer disintegration. However, the spacer preserves the acromiohumeral distances optimizing the balance on the humeral head and consequent improvement of pain.{% sup %}31{% /sup %}

  ## Partial rotator cuff repair

  The biomechanical concept of the “suspension bridge” in the rotator cuff was introduced for the first time by Burkhart et al,32 in 1993, leading to the hypothesis of the functional rotator cuff and the possibility for a functional partial repair of the cuff tear.

  Repair has to include the whole SSc as well as the inferior half of infraspinatus at least, in order to restore the transverse force couples and a stable fulcrum for physiologic glenohumeral kinematics (Figure 2).

  Porcellini et al{% sup %}33{% /sup %} showed with their study that the CS of the patients improved from 44 to 73 points and the Simple Shoulder Test from 4.6 to 9. The acromion humeral distance increased from 6.1 to 9.1 mm. They stated that “partial” functional repair of the infraspinatus, leaving the greater tuberosity uncovered, gives good results in terms of patient satisfaction and in restoring the acromion humeral distance.

  ## Tendon transfer procedures

  The choice of the most appropriate tendon transfer depends on several aspects such as the clinical presentation (pain or disability), age of the patient, functional demand, medical comorbidities, joint stability, and presence of arthritis. The ideal candidate for a tendon transfer procedure is a young, active patient with a severe disability related to weakness and loss of rotation, without glenohumeral osteoarthritis.{% sup %}34–36{% /sup %} The selection of the donor muscle is based on the structural deficit and impaired function that we want to restore.

  Posterosuperior irreparable cuff tears are commonly treated with the latissimus dorsi (LD) tendon transfer, while for irreparable anterosuperior tears pectoralis major (PMa) tendon transfer is used.{% sup %}37,38{% /sup %}

  Other procedures include LD and teres major transfer (L’Episcopo procedure), lower trapezius (LT) transfer, and pectoralis minor (PMi) transfer.

  ## LD transfer

  LD transfer provides a large, vascularized tendon from a muscle that originally contributes to internal rotation, retroversion, and abduction of the shoulder joint.

  The tendon detached and transferred to close a posterosuperior cuff defect changes its function to exert an external rotational moment and depression of the humeral head, allowing more effective action of the deltoid muscle in abduction.

  Originally described by Gerber et al{% sup %}39{% /sup %} in 1988, LD tendon transfers were firstly used in patients with brachial palsy in order to treat the lack of external rotation.

  Inclusion criteria are patients with posterosuperior irreparable cuff tear, muscle atrophy, and fatty infiltration, with an impairment of abduction and external rotation.

  The irreparable supraspinatus and infraspinatus tendons are typically torn with retraction to the level of the glenoid (Patte stage 3), and at clinical examination, patients present positive drop-arm and external rotation lag tests.{% sup %}40{% /sup %} At the MRI assessment, fatty infiltration should present Goutallier grade >3.

  Exclusion criteria are patients with SSc tendon tear (Lafosse >2), eccentric arthritis (Hamada >4), pseudoparalytic shoulder, deltoid dysfunction, and atrophic teres minor.

  The SSc tendon should be intact and functioning indeed, as forward elevation and glenohumeral stability drastically decrease with SSc insufficiency.{% sup %}41{% /sup %}

  Approaches described for the transfer include two-incision technique,39 single incision, and arthroscopy-assisted procedure (Figure 3A–D). Habermeyer et al{% sup %}42{% /sup %} described a single V-shaped incision approach for direct visualization of the posterior humeral head and transfer of the tendon in a more posterior position.

  In the majority of patients LD tendon transfer is very effective in reducing pain; however, the functional outcome is more variable.{% sup %}43{% /sup %} Correct indications and patient selection are crucial.

  Long-term follow-up reported by Gerber{% sup %}39{% /sup %} shows an average increase in the subjective shoulder value from 29% preoperatively to 70%, an increase of the mean CS from 56% to 80%, and an improvement of pain score from 7 to 13 points. Mean flexion increased from 118° to 132°, abduction from 112° to 123°, and external rotation from 18° to 33°. Poor results occurred in shoulders with insufficiency of the SSc muscle and fatty infiltration of the teres minor muscle.

  ## L’Episcopo procedure

  In 1934, L’Episcopo{% sup %}44{% /sup %} described a combined teres major and LD transfer for obstetric brachial plexus palsy, changing their function from internal to external rotators as well as humeral depressor.

  A modified L’Episcopo technique was proposed in 2002 by Habermeyer et al{% sup %}45{% /sup %} with the indication to restore loss of external rotation in patients with massive posterosuperior RCT. Boileau et al{% sup %}46{% /sup %} published in 2007 early results of their single-incision modified L’Episcopo technique, using a delto-pectoral approach in beach chair position, with few complications, greater external rotation owing to addition of the teres major transfer and possibility to associate it with reverse shoulder arthroplasty.

  ## PMa transfer

  SSc tears have less frequent incidence than the posterosuperior RCTs.

  SSc acts as the primary internal rotator and anterior dynamic stabilizer. Patients with SSc RCTs typically present with anterior shoulder pain, internal rotation weakness, and dysfunction, associated with belly-press, bear-hug, and lift-off positive tests.{% sup %}47{% /sup %} The outcomes of direct repair of chronic SSc tears with fatty infiltration, Goutallier grade ≥3, are poor.{% sup %}48,49{% /sup %} In these cases, a tendon transfer with PMa is a possible treatment for restoring internal rotation forces.

  PMa flexes, internally rotates, and adducts the humerus. Ideal patients for this transfer are those with an irreparable anterosuperior cuff tear with minimal glenohumeral joint arthritic changes and a functioning deltoid muscle, age <65, intact or reparable posterosuperior RCTs.{% sup %}37,50{% /sup %}

  PMa can be transferred anterior to the conjoined tendon as originally described in 1997 by Wirth and Rockwood{% sup %}48{% /sup %} or only the superior two-thirds of the tendon can be transferred under the conjoined tendon as described by Resch et al{% sup %}37{% /sup %} (Figure 4A and B).

  In 2001, Warner described a transfer using the inferior sternal head attachment under the clavicular head but anterior to the conjoined tendon to avoid injury to the musculocutaneous nerve.{% sup %}51{% /sup %}

  Despite good outcomes reported by several authors, no comparative studies have been performed to compare the different techniques.

  Resch et al{% sup %}37{% /sup %} and then Galatz et al{% sup %}52{% /sup %} reported satisfactory results after subcoracoid transfer of the PMa tendon with a massive RCT with improvement in pain and function (ASES scores improved from 27.2 to 47.7).

  ## PMi transfer

  The PMi tendon as a graft to treat irreparable SSc tears was first used by Wirth and Rockwood,48 who even tried to use the coracohumeral ligament.

  PMi transfer is indicated in irreparable RCT involving the upper two-thirds of the SSc tendon.

  Paladini et al{% sup %}53{% /sup %} used a subcoracoid PMi transfer with a small piece of the coracoid for tears of the superior two-thirds of SSc associated with irreparable supraspinatus tears (Figure 5A and B). At 2 years of follow-up, 27 patients demonstrated good outcome with significant improvement in CS and 78% of them returned to their daily activity.

  ## LT transfer

  Historically, the trapezius is the most common tendon transfer performed for adult patients with brachial plexus injury.{% sup %}54{% /sup %}

  In 2009, Elhassan et al{% sup %}55{% /sup %} performed the transfer of middle trapezius and LT to restore shoulder external rotation in a patient with brachial plexus injury. This technique has been proposed also for patients with irreparable posterosuperior cuff tears.{% sup %}56{% /sup %} LT is grafted from an incision medial to the scapula, then augmented with an Achilles’ tendon allograft, passed underneath the deltoid and infraspinatus, and positioned on the infraspinatus footprint. One of the problems about transferring part of the trapezius could be loss of the stabilizing effect of this muscle on the scapula. However, if the serratus anterior is functioning normally, then the risk of scapular winging is low.{% sup %}55{% /sup %} Elhassan et al reported a significant improvement in active abduction, flexion, and external rotation. At an average follow-up of 47 months, 32 out of 33 patients had significant improvement in the pain levels, an average forward flexion of 120°, abduction of 90°, and external rotation of 50° (range, 20°–70°; P<0.01). A biomechanical study published by Hartzler et al,57 using a novel shoulder model, compared the moment arm of external rotation of the LD, teres major, and LT transfers. They showed that LT had the largest moment arm of external rotation and that the LD transfer had the lowest moment arm of external rotation with the shoulder adducted. The LD becomes potentially the most efficient transfer for external rotation with the arm abducted. Omid et al{% sup %}58{% /sup %} also stated, in their biomechanical study on cadaveric shoulders, that the LT transfer is biomechanically superior to the latissimus transfer in restoring native glenohumeral biomechanics and joint reaction forces in both the compressive distractive and anterior–posterior planes.

  ## Interposition allografts

  There have been reports of using fascia lata or human dermal allograft interposed in massive or irreparable RCT (Figure 6). Dimitrios et al in 2015 have shown improvement in pain and CS (from 32.5 to 88.7) in 68 patients treated with interposition of fascia lata allograft for irreparable RCT with a follow-up of 12 months. At the end of 12 months ultrasound examination of 30 patients showed that only three of the patients had retear.{% sup %}61{% /sup %} Pandey et al in 2017 showed in their prospective nonrandomized cohort study of 26 patients having symptomatic irreparable RCT, managed with partial repairs in the first half of patients and with partial repair along with interposition GraftJacket dermal allograft in the second half of patients, that the postoperative scores for the latter group were significantly higher than the former group. The Oxford Shoulder Score (OSS) improved from 14.9 to 43.9 in the dermal allograft group in comparison to 17.8–37.1 OSS only in the partial repair group. The CS improved from 41.2 to 83.9 in the dermal allograft group while it changed from 43.1 to 70.8 in the former group.{% sup %}62{% /sup %}

  ## Interposition autografts

  Mori et al in 2015 have shown that partial repair with interposition of fascia lata autograft improved CS, ASES scores, and range of motion in irreparable RCTs with high-grade (Goutallier stage 3 or 4) supraspinatus fatty degeneration and low-grade (Goutallier stage 1 or 2) infraspinatus fatty degeneration in comparison to irreparable RCTs with high-grade both supraspinatus and infraspinatus fatty degeneration treated with the same procedure after a follow-up of 24 months.{% sup %}63{% /sup %}

  Mihara et al used iliotibial band with a Gerdy’s tubercle bone block autograft for irreparable RCTs and have shown that the bone block unites with the greater tubercle at 3–4 months, confirmed on computed tomography, and after 24 months of follow-up there is significant improvement in pain, subjective scores, and range of motion. They also highlighted that there was no donor site morbidity.{% sup %}64{% /sup %}

  ## Superior capsular reconstruction (SCR)

  There is an additional defect of superior capsule in patients with irreparable RCT affecting the movements of the humeral head in all directions in addition to the movement on the side of lesion, which has been termed as “circle concept” and this adds to the shoulder instability in such irreparable RCTs.{% sup %}65,66{% /sup %} Mihata et al in their seminal paper described the technique of SCR where they completely repaired the SSc tendon and partially repaired the infraspinatus and teres minor tendons. After this, the fascia lata autograft, 6–8 times folded, was introduced in the joint folded and was medially fixed to the superior glenoid with two suture anchors and was fixed laterally to the greater tuberosity using the compression double-row technique. The graft was also sutured posteriorly to the infraspinatus tendon and anteriorly to the residual supraspinatus or SSc tendons for a better force–couple moment, suturing the tendons to the graft side to side.{% sup %}67{% /sup %} After a follow-up of 24–51 months (mean 34.1 months), there was an increase in ASES, Japanese Orthopaedic Association, and University of California at Los Angeles scores from 23.5 to 92.9, from 48.3 to 92.6, and from 9.9 to 32.5, respectively. Forward flexion, external rotations were also improved after 24 months. The acromiohumeral distance increased from 4.6 to 8.7 mm, thereby improving the instability.

  There have been different techniques for graft introduction into the joint such as the double pulley system, two double pulley system, zip line shuttle, arthroscopic knot pusher, or by traction on a single suture anchor.{% sup %}68{% /sup %}

  Chillemi et al have used the proximal long head of biceps as an autograft after tenotomy, two medial suture anchors to the superior glenoid, and two lateral transosseous tunnel to fix the autograft.{% sup %}69{% /sup %}

  The indications for this surgery are young patients with massive irreparable posterosuperior RCTs with no arthritis. There is generally Goutallier stage ≥3 fatty degeneration with retraction of supraspinatus or infraspinatus tendons going up to the glenoid or just medial to it.{% sup %}68{% /sup %}

  Fixed high riding humeral head is a contraindication for the surgery but if the humeral head can be reduced to its normal position by performing sulcus maneuver SCR can be done as this indicates that there is sufficient mobility which can be stabilized by the SCR autograft.{% sup %}68{% /sup %}

  ## Reverse total shoulder arthroplasty (RTSA)

  RTSA is the first choice of treatment to improve elevation in patients with a true pseudoparalytic shoulder, irreparable RCT, glenohumeral osteoarthritis, who are not candidates for arthroscopic procedures or tendon transfers.

  Even though the indications for RTSA have been expanded to treat a number of pathologies with an average good outcome, the best results in terms of functional and clinical outcomes after reverse shoulder arthroplasty (RSA) are obtained in patients with RCT arthropathy. Wall et al{% sup %}59{% /sup %} presented in 2007 a review of the results of RSA according to different etiologies. The study showed an increase of CS from 27.8 preoperatively to 63.4 in patients treated with RSA in massive RCTs. In a systematic review in 2017, Petrillo et al{% sup %}70{% /sup %} confirmed a statistically significant improvement in all clinical scores and shoulder mobility, with some limits in external rotation. However, they reported high perioperative complication rates, resulting in an increased number of revision surgeries. Among these complications noticeable ones were mechanical failure (2.4%), acromion fractures (2.7%), infections (0.9%), and heterotopic ossification (6.6%). In patients with associated positive external rotation lag sign or Hornblower sign, LD transfer or LD teres major transfer could be associated to RSA.{% sup %}46,59{% /sup %} The above-mentioned good results of Boileau et al have been confirmed in a 2-year follow-up study published in 2013 by Boughebri et al.{% sup %}60{% /sup %}

  ## Conclusion

  Irreparable RCTs are a common condition which shoulder surgeons have to deal with. Over the years several treatment options have been proposed, but the real challenge is to apply the correct indication for the correct procedure for each patient. Patients without anterosuperior migration of the humeral head should initially be treated conservatively with physical therapy and anterior deltoid strengthening. Patients nonresponsive to conservative treatment, complaining of pain and impairment of elevation, should undergo injection of local anesthetics and steroids to assess if the pseudoparalysis is due to pain.

  Literature confirms that in patients, with a painful shoulder with irreparable RCT, who are not able to elevate the arm (even after steroid injection), arthroscopic debridement is indicated; biceps tenotomy, partial repair, and SSN release can also be performed, according to MRI and EMG findings.

  The subacromial biodegradable spacer is a device that is helpful to restore the acromiohumeral height, improving the balance forces across the humeral head. Even if the spacer deflates and reabsorbs, it lasts sufficiently (~15 months) for an efficient physical therapy program.

  Patients who have chronic posterosuperior cuff tear and loss of external rotation, but with conserved elevation and an intact SSc, are suited for LD transfer. In chronic anterosuperior cuff tear, with an intact superior cuff and no humeral escape, PMa or pectoral minor is indicated. Tendon transfers are complex surgical procedures that require a long period of rehabilitation. They do not restore normal shoulder function and kinematics, but can rather be considered as salvage procedures. Massive irreparable posterosuperior RCTs even with SSc tear can be managed with SCR also. Reverse shoulder prosthesis is indicated in patients with glenohumeral osteoarthritis, irreparable RCT, and pseudoparalytic shoulder. The schematic diagram in Figure 7 illustrates a reasonable approach in the management of irreparable RCT.

