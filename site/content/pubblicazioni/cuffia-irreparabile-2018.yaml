abstract: |
  Irreparable rotator cuff tears are common conditions seen by shoulder surgeons, characterized by a torn and retracted tendon associated with muscle atrophy and impaired mobility. Direct fixation of the torn tendon is not possible due to the retracted tendon and lack of healing potential which result in poor outcome. Several treatment options are viable but correct indication is mandatory for a good result, pain improvement, and restoration of shoulder function. Patient can be treated either with a conservative program or surgically when necessary, by different available modalities like arthroscopic debridement, partial reconstruction, subacromial spacer, tendon transfer, and shoulder replacement with reverse prosthesis. The aim of this study was to review literature to give an overview of the available possible solutions, with indications and expected outcomes. Keywords: irreparable rotator cuff tear, arthroscopy, partial repair, tendon transfer, graft augmentation
riassunto:
  it: 'Quando il tendine è troppo retratto o degenerato per essere riattaccato, esistono comunque soluzioni: debridement, ricostruzione capsulare superiore, transfer muscolari, protesi inversa. La revisione spiega quando scegliere ciascuna.'
  en: 'When the tendon is too retracted or degenerated to be reattached, solutions still exist: debridement, superior capsular reconstruction, tendon transfers, reverse replacement. The review explains when to choose each.'
