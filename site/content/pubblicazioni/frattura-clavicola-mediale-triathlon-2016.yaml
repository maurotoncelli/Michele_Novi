slug: 'Unusual Medial-End Clavicle Fracture Combined with Double Disruption of the Superior Shoulder Suspensory Complex (SSSC): A Case Report in Triathlon Athlete'
titolo: 'Unusual Medial-End Clavicle Fracture Combined with Double Disruption of the Superior Shoulder Suspensory Complex (SSSC): A Case Report in Triathlon Athlete'
titoloBreve:
  it: 'Frattura mediale della clavicola con doppia lesione del complesso sospensore della spalla in un triatleta'
  en: 'Medial clavicle fracture with double SSSC disruption in a triathlon athlete'
autori: 'Andrea Poggetti, Michele Novi, Marco Rosati, Pietro Battistini, Paolo Domenico Parchi, Michele Lisanti'
rivista: 'Journal of Orthopaedic Case Reports'
anno: 2016
volume: '6(3):19–21'
doi: '10.13107/jocr.2250-0685.482'
pubmedId: '28116259'
url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC5245927/'
abstract: |
  INTRODUCTION: Most published floating clavicle reports describe a dislocation or fracture of one or both ends of the clavicle. CASE PRESENTATION: We reported a new framework of this injury in a young triathlon athlete: a medial-end displaced fracture with co-existent double disruption of the superior shoulder suspensory complex (SSSC), with the anterior shoulder arch wholly disconnected from the nearby structure. CONCLUSION: The management of these complex fractures remains an open debate. The infrequent publications and the rarity of this type of injury do not establish a single standard treatment. However, when patients with high functional demands are involved, the authors suggest surgical management of medial-end clavicle fractures followed by restoration of the SSSC if damaged on more than two locations.
riassunto:
  it: 'Caso clinico raro di frattura scomposta dell''estremità mediale della clavicola associata a doppia interruzione del complesso sospensore della spalla in un giovane triatleta: il trattamento chirurgico mirato ha permesso di ripristinare la stabilità articolare per un rientro sportivo ad alta richiesta.'
  en: 'Rare case of a displaced medial clavicle fracture combined with double disruption of the superior shoulder suspensory complex in a young triathlon athlete, treated surgically to restore stability for high-demand sport.'
