slug: 'A Long-Term Follow-Up of Post-Operative Periprosthetic Humeral Fracture in Shoulder Arthroplasty'
titolo: 'A Long-Term Follow-Up of Post-Operative Periprosthetic Humeral Fracture in Shoulder Arthroplasty'
titoloBreve:
  it: 'Fratture dell''omero intorno a una protesi di spalla'
  en: 'Humeral fractures around a shoulder replacement'
