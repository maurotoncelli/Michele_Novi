  en: 'Radial head fractures: assessment, classification and management'
autori: 'Luigi Tarallo, Alberto Negri, Michele Novi, Gianmario Micheloni, Erica Keeling, Giuseppe Porcellini'
rivista: 'Minerva Orthopedics'
anno: 2022
volume: '73(2):122–131'
