abstract: |
  Radial head fractures are frequent elbow injuries with several fracture patterns and associated lesions. The literature highlights the importance of correct patient management right from the earliest stages to achieve the best results and to avoid complications. The purpose of this article was to provide an overview of current concepts of the management of radial head fractures. The main goal of each treatment should be to restore elbow biomechanics, kinematics and stability to achieve a complete range of motion and to early begin rehabilitation programs. For Mason type 1 fractures the nonoperative management is the best choice providing good or excellent results in most patients. There is less agreement regarding Mason type 2 fractures, in terms of nonoperative or surgical treatment. When surgical treatment is chosen, open reduction and internal fixation seems to guarantee the best clinical outcomes with excellent results reported. Mason type 3 or 4 fractures are managed with surgical treatment. However, the best method of treatment remains controversial in literature between open reduction and internal fixation, radial head arthroplasty and radial head excision. In the last years, arthroscopy is going to assume an important role in the management of elbow diseases, not only as a diagnostic tool but also as a surgical solution.
riassunto:
  it: 'Panoramica aggiornata sulle fratture del capitello radiale secondo la classificazione di Mason: quando è sufficiente il trattamento conservativo con mobilizzazione precoce e quando servono sintesi chirurgica, protesi o artroscopia.'
  en: 'Updated overview of radial head fractures according to the Mason classification: when conservative management with early mobilisation is best and when surgical fixation, replacement or arthroscopy is indicated.'
