  en: 'Radial head fractures: assessment, classification and management'
autori: 'Luigi Tarallo, Alberto Negri, Michele Novi, Gian Mario Micheloni, Erica Keeling, Giuseppe Porcellini'
rivista: 'Minerva Orthopedics'
anno: 2022
volume: '73(2)'
