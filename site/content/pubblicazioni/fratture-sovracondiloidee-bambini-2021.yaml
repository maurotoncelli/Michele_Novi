riassunto:
  it: 'Le fratture sovracondiloidee dell''omero sono considerate le fratture del gomito più frequenti nei bambini. Il lavoro riassume la gestione secondo la classificazione di Gartland: trattamento conservativo per le fratture composte o poco scomposte, riduzione chiusa e sintesi percutanea con fili laterali per quelle scomposte di tipo II e III. Diagnosi corretta e protocollo adeguato servono a evitare complicanze neurovascolari e vizi di consolidazione.'
  en: 'Supracondylar humeral fractures are widely considered the most common elbow fractures in children. The review summarises management according to the Gartland classification: conservative treatment for non-displaced or minimally displaced fractures, closed reduction and percutaneous fixation with lateral pins for displaced type II and III fractures. Correct diagnosis and a proper protocol are needed to avoid neurovascular complications and malunion.'
