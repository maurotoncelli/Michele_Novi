abstract: |
  Supracondylar humeral fractures are widely considered the most common elbow fracture in children. Gartland classification plays a fundamental role in decision-making regarding management and prognosis. Recent literature recommends conservative management for non- or minimally displaced fractures, whereas there seems to be a trend towards surgical treatment for all displaced fractures. The preferred treatment for displaced Gartland II and Gartland III fractures is closed reduction and percutaneous fixation with lateral pins. In particular patterns a medial pin is recommended to obtain a stable construct. Neurovascular complications are mostly associated with Type III fractures and sometimes surgical exploration with fracture reduction is needed. Correct diagnosis and a proper management protocol are mandatory to avoid early and late complications such as neurovascular impairment and malunion.
riassunto:
  it: 'Le fratture sovracondiloidee sono le fratture del gomito più frequenti in età pediatrica. Il lavoro riassume la gestione secondo la classificazione di Gartland, dalla scelta conservativa alla riduzione e sintesi percutanea con fili per evitare complicanze vascolonervose e vizi di consolidazione.'
  en: 'Supracondylar fractures are the most common elbow fractures in children. The review outlines management according to the Gartland classification, from conservative care to closed reduction and percutaneous pinning to prevent neurovascular complications and malunion.'
