slug: 'Gartland type III supracondylar fracture in children: is open reduction really a dangerous choice?'
titolo: 'Gartland type III supracondylar fracture in children: is open reduction really a dangerous choice?'
titoloBreve:
  it: 'Frattura sovracondiloidea Gartland III nei bambini: la riduzione aperta è davvero pericolosa?'
  en: 'Gartland III supracondylar fracture in children: is open reduction really dangerous?'
autori: 'Tarallo L, Novi M, Porcellini G, Schenetti C, Micheloni GM, Maniscalco P, Catani F'
rivista: 'Injury'
anno: 2021
volume: '53 Suppl 1:S13–S18'
doi: '10.1016/j.injury.2021.02.071'
pubmedId: '33678463'
abstract: ''
riassunto:
  it: 'Frattura del gomito molto scomposta nei bambini (Gartland III). Su 55 casi, riduzione chiusa e aperta hanno avuto le stesse complicanze maggiori: nessuna. L''aperta non è la prima scelta, ma quando la chiusa non basta — o c''è una lesione vascolonervosa — non è più pericolosa e spesso ripristina meglio l''asse.'
  en: 'A badly displaced elbow fracture in children (Gartland III). In 55 cases, closed and open reduction had the same major complications: none. Open reduction is not first line, but when closed reduction fails — or there is a neurovascular injury — it is not more dangerous and often restores the axis better.'
