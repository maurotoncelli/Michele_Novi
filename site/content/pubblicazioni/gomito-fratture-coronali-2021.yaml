riassunto:
  it: 'Sono fratture della parte articolare del gomito, difficili da vedere in radiografia e da fissare. Il lavoro descrive gli accessi chirurgici e le tecniche di sintesi per permettere il movimento precoce.'
  en: 'These are fractures of the articular part of the elbow, hard to see on X-ray and to fix. The paper describes surgical approaches and fixation techniques that allow early movement.'
