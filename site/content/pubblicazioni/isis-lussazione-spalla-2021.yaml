slug: 'Instability Severity Index Score Does Not Predict the Risk of Shoulder Dislocation after a First Episode Treated Conservatively'
titolo: 'Instability Severity Index Score Does Not Predict the Risk of Shoulder Dislocation after a First Episode Treated Conservatively'
titoloBreve:
  it: 'L''indice ISIS non predice la recidiva dopo una prima lussazione di spalla trattata senza intervento'
  en: 'Instability Severity Index Score after a first conservatively treated shoulder dislocation'
autori: 'Umile Giuseppe Longo, Rocco Papalia, Gianluca Ciapini, Sergio De Salvatore, Carlo Casciaro, Elisa Ferrari, Fabio Cosseddu, Michele Novi, Ilaria Piergentili, Paolo Parchi, Michelangelo Scaglione, Vincenzo Denaro'
rivista: 'International Journal of Environmental Research and Public Health'
anno: 2021
volume: '18(22):12026'
