pubmedId: '34831778'
url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC8623142/'
abstract: |
  The first purpose of this study was to verify the association between Instability Severity Index Score (ISIS) and Recurrent Shoulder Dislocation (RSD) after a first episode treated conservatively. The second aim is to identify the risk factors associated with RSD after a primary acute shoulder anterior dislocation treated conservatively. A total of 111 patients with first traumatic anterior shoulder dislocation treated at a single trauma centre between January 2014 and March 2016 were enrolled. The main predictive variables of risk factors and the ISIS score were calculated. Among the 85 patients included, 26 cases of RSD were observed (30.6%). Considering the whole population, no significant association between ISIS and RSD was reported. Regarding other risk factors, high-risk working activities and rotator cuff injury had a significantly higher RSD risk. Sex, dominant limb, family history, hyperlaxity, contact or overhead sports, competitive sport, post-reduction physiokinesitherapy, return to sports activity time, Hill-Sachs lesion, bony Bankart lesion and greater tuberosity fracture did not seem to influence the risk of RSD. No correlation between ISIS score and RSD in patients treated conservatively after a first episode of shoulder dislocation was reported. The only risk factors with a significant association to RSD were high-risk working activities and rotator cuff injury.
riassunto:
  it: 'Studio su pazienti trattati conservativamente dopo la prima lussazione traumatica anteriore di spalla: il punteggio ISIS da solo non predice il rischio di recidiva, mentre risultano determinanti le attività lavorative ad alto carico e le lesioni associate della cuffia dei rotatori.'
  en: 'Study on patients managed non-operatively after a first traumatic anterior shoulder dislocation: the ISIS score alone did not predict recurrence, whereas high-demand occupational activities and associated rotator cuff tears significantly increased recurrence risk.'
