slug: 'Acute elbow dislocation: comparison between magnetic resonance imaging and intra-operative finding of ligament injury'
titolo: 'Acute elbow dislocation: comparison between magnetic resonance imaging and intra-operative finding of ligament injury'
titoloBreve:
  it: 'Lussazione acuta del gomito: risonanza magnetica e riscontro intraoperatorio delle lesioni legamentose'
  en: 'Acute elbow dislocation: MRI versus intra-operative ligament injury findings'
autori: 'Luigi Tarallo, Giovanni Merolla, Giuseppe Porcellini, Maria Grazia Amorico, Gian Mario Micheloni, Michele Novi, Ettore Di Giovine, Fabio Catani'
rivista: 'International Orthopaedics'
anno: 2021
volume: '45(1):265–273'
doi: '10.1007/s00264-020-04875-5'
pubmedId: '33200244'
abstract: |
  PURPOSE: The aim of this current study was to assess elbow ligament tears after dislocation using magnetic resonance imaging (MRI) and to correlate any pre-operative imaging with intra-operative findings of elbow ligament tears. METHODS: We prospectively included 32 patients with acute elbow dislocation investigated by MRI at a mean of five days from dislocation. A simple elbow dislocation was diagnosed in 14 patients (44%); associated bone injuries were identified in 18 elbows (56%). Surgical repair of elbow ligaments was carried out in 23 patients, and nine cases were treated non-operatively. A blinded MRI evaluation of all 32 elbows was performed by an orthopaedic surgeon and a musculoskeletal radiologist. RESULTS: Inter-rater agreement for MRI evaluation was poor for lateral ulnar collateral ligament (LUCL) tears, fair for radial collateral ligament (RCL), moderate for annular ligament (AL), and fair for ulnar collateral ligament (UCL). Correlation between surgical and MRI findings showed good inter-rater agreement for LUCL and AL tears in both raters. Intra-operative findings showed ten radial head fractures and ten coronoid fractures. Bone injuries and ligament tears were not significantly associated. CONCLUSION: MRI scan supported surgeons to identify soft tissue injuries and to address the most suitable surgical approach after acute elbow dislocation. Inter-observer agreement for intra-operative findings was high for lateral collateral ligament complex injuries and poor for UCL.
riassunto:
  it: 'Studio prospettico su 32 pazienti con lussazione acuta del gomito: la risonanza magnetica eseguita nei primi giorni aiuta a identificare le lesioni del compartimento legamentoso laterale e a pianificare l''accesso chirurgico più adeguato.'
  en: 'Prospective study of 32 patients with acute elbow dislocation: early MRI helps identify lateral collateral ligament complex tears and plan the most appropriate surgical approach.'
