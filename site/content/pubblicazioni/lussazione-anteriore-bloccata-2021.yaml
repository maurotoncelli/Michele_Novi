  it: 'La lussazione anteriore bloccata di spalla'
  en: 'Locked anterior shoulder dislocation'
autori: 'Michele Novi, Luigi Tarallo, Alessandra Colozza, Paolo Paladini, Gianmario Micheloni, Fabio Catani, Giuseppe Porcellini'
