slug: 'Isolate and irreducible radial head dislocation in children: a rare case of capsular interposition'
titolo: 'Isolate and irreducible radial head dislocation in children: a rare case of capsular interposition'
titoloBreve:
  it: 'Lussazione isolata e irriducibile del capitello radiale nel bambino'
  en: 'Isolated irreducible radial head dislocation in children due to capsular interposition'
autori: 'Luigi Tarallo, Michele Novi, Giuseppe Porcellini, Fabio Catani'
rivista: 'BMC Musculoskeletal Disorders'
anno: 2020
volume: '21(1):659'
doi: '10.1186/s12891-020-03685-5'
pubmedId: '33028267'
url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC7542714/'
abstract: |
  BACKGROUND: Radial head dislocation with no associated lesions is a relatively uncommon injury in children. In this case report, we present a case of anteromedial locked radial head dislocation in a child and discuss its clinical presentation and pathogenetic mechanism of injury. CASE PRESENTATION: An 8-year-old girl fell on her right forearm with her right elbow extended in hyperpronation. An isolated radio-capitellar dislocation was identified with no other fractures or neurovascular injuries associated. The elbow presented a limited extension-flexion arc (0°–90°), and pronosupination under general anesthesia showed a "sling effect" from maximal pronation (+55°) and supination (+90°) to neutral position of the forearm. The radial head dislocation was impossible to reduce closed and an open reduction was performed using a lateral Kocher approach. The radial head was found "button-holed" through the anterior capsule. Only by cutting the lateral bundle of the capsule was it possible to reduce the joint. At 50 months follow-up, the patient presented a complete range of motion, complete functionality and no discomfort or instability even during sport activities. DISCUSSION AND CONCLUSION: It is important to understand the pathogenic mechanisms of locked radial head dislocation in children. Even the anterior capsule can hinder reduction; a characteristic "sling-effect" of the forearm can be pathognomonic for capsular button-holing. Surgical release of the capsular bundle is sometimes the only way to reduce the dislocation and obtain a good outcome.
riassunto:
  it: 'Caso clinico raro di lussazione isolata del capitello radiale in una bambina di 8 anni rimasta bloccata per interposizione della capsula articolare: il riconoscimento del segno clinico e la riduzione aperta hanno consentito un recupero completo del gomito a oltre 4 anni.'
  en: 'Rare case of isolated radial head dislocation in an 8-year-old girl locked by anterior capsule interposition: recognising the clinical sign and performing open reduction achieved full elbow recovery at over 4 years.'
