testoIntegrale: |
  ## Abstract

  **Background:** The integration of machine learning in orthopedic surgery, including shoulder procedures, has garnered increasing interest. This retrospective analysis aims to externally validate a predictive analytics platform within a patient cohort undergoing reverse total shoulder arthroplasty for eccentric or concentric glenohumeral osteoarthritis.

  **Methods:** Ninety patients who underwent reverse total shoulder arthroplasty at our institution in 2022 were selected for this study. Patients were divided into 2 groups based on the type of implant (50 Exactech Equinoxe and 40 Zimmer Biomet Comprehensive). Preoperative evaluations included 19 variables per the tool requirements (demographics, diagnosis, comorbidities, patient-reported pain and function, and range of motion). The study compared the tool's outcome predictions with postoperative outcomes at 3-6 months, 1 year, and 2 years postsurgery for visual analog scale and active range of movement. We also quantified the mean absolute error (MAE) separately in the 2 groups and compared it to the MAE from the internal validation of the same tool.

  **Results:** Significant improvements in visual analog scale, active forward elevation, active abduction, and active external rotation met the minimal clinically important difference at 3-6 months, 1 year, and 2 years in both implant groups. Additionally, a modest improvement in active internal rotation was observed in both cohorts. In terms of MAE, we found a higher error than the internal validation only for forward elevation at 3-6 months in group 2 and a lower error in all the other outcome measures at all time points for both groups.

  **Conclusion:** The predictive analytics platform demonstrated a lower or similar MAE than the internal validation for both groups. Notably, we found that the tool's predictions are generalizable to another shoulder prosthesis, even though it was not trained on that particular product. This tool holds promise for aiding clinicians in managing patient expectations.

  Interest in possible artificial intelligence applications in orthopedic surgery grew exponentially in the last 4 years.[13],[16] In particular, machine learning, given the large amount of data available in the previous decade, has been used in its many declinations (the most widely known is deep learning) to help clinicians in diagnostics and outcome predictions.[7],[16] In shoulder surgery, in particular, between 2010 and 2022, 45 studies regarding artificial intelligence applications in surgical and nonsurgical shoulder pathology were published,[5] and the main research objects, as well as those where the best results were obtained, were imaging in diagnostics of rotator cuff pathology and prediction of functional outcomes in prosthetic surgery.[6],[15] We have therefore decided to externally validate, at our institution, a predictive analytics platform (Predict+ Rev B 12-0001480; Exactech, Gainesville, FL, USA) by comparing its predictions with our results at 3-6 months, 1 year, and 2 years postsurgery.

  Predict+, an Exactech product, is defined as a “data-driven, clinical decision support tool that creates personalized patient outcome predictions using preoperative data to anticipate patients' postoperative results after anatomic or reverse total shoulder arthroplasty (rTSA)”.

  This machine learning–powered predictive analytics platform was clinically released in 2020. Predict+ had been trained with a database of over 6,500 patients, two-third of which were used to create the prediction model and one-third to test the model[11],[12]; of the 291 inputs recorded for each patient, the 19 that most influenced postoperative outcomes were selected. Visual analog scale (VAS), a range of motion, Global Shoulder Function, and Shoulder Arthroplasty Smart Score are predicted from 3 months to 7 years postoperative (Figs. 1 and 2).[11],[12]

  ## Materials and methods

  All patients who underwent rTSA for glenohumeral osteoarthritis or cuff tear arthropathy in our institution in 2022 were eligible for inclusion in this study. Exclusion criteria were the absence of the preoperative inputs required by Predict+ (demographic data, diagnosis, comorbidities, patient-reported pain and function, ranges of motion), the absence of follow-up visits at 3-6 months, 1 year, and 2 years, and visits that do not include pain and range of motion measurements (Table I).

  A total of 90 patients met the inclusion criteria. The composition of the groups group 1, treated with Equinoxe rTSA (Exactech); group 2, treated with Comprehensive rTSA, (Zimmer Biomet, Warsaw IN, USA) was the following (Table II).

  The inputs above were inserted in Predict+, creating an anonymized file for every patient. Immediately after the insertion and confirmation of the inserted data, a prediction of the following clinical items at 6 time points after surgery (3 months, 6 months, 1 year, 2 years, 3-5 years, 7 years) is created by the tool: VAS score, Global shoulder function, Shoulder Arthroplasty Smart score, active abduction (aAB), active forward elevation (aFE), active external rotation (aER), and active functional internal rotation (aFIR).

  Due to the retrospective nature of the study, we only considered the items of which we had a complete preoperative and postoperative evaluation at 3-6 months, 1 year, and 2 years, namely VAS, aAB, active forward flexion, aER, and aFIR.

  The first data we evaluated were if the difference between pre and postoperative mean values in the 2 groups reached the minimal clinically important difference (MCID), namely: 1.4 points for VAS, 12° for aFE, 7° for aAB, and 3° for aER.[21],[22]

  We have not found an MCID value for aFIR[21],[22] in the current literature. We have therefore compared the mean values of our outcomes (at 3-6 months, 1 year, and 2 years postoperative, separately in the 2 groups) with Predict+ predicted outcomes, evaluating if the difference was below the MCID for VAS, active anterior flexion, aAB, and aER and measuring the difference between postoperative and predicted aFIR (aFIR values: 1 = lateral thigh; 2 = buttocks;3 = sacrum;4 = L4-L5; 5 = L1-L2; 6 = D10-D12; 7 = Higher than D10).

  We also assessed the mean absolute error (MAE), namely the mean difference between the predicted and postoperative value for every outcome measure listed in Table III, separately in the 2 groups, at 3 different postoperative time points. MAEs we found were compared to the MAEs from the internal validation.[10],[12]

