  Table VI is the 2-year outcomes vs. Predict+ prediction at 2 years (average values):

  As shown, deviations below the MCID were found in VAS (groups 1 and 2), anterior flexion (groups 1 and 2), abduction (group 2), and external rotation (group 1).

  Table VII is the MAE in the 2 groups at all time points for every outcome measure, separately compared with the MAE from the internal validation:

  To summarize, in group 1 (Equinoxe), Predict+ projected outcomes diverged less than MCID from actual outcomes in VAS at 3-6 months, at 1 year, and 2 years; anterior flexion at 3-6 months, at 1 year, and 2 years, and external rotation at 3-6 months, at 1 year, and 2 years; in group 2 (Comprehensive) similar accuracy was found in VAS at 3-6 months, at 1 year, and 2 years; anterior flexion at 1 year and 2 years, abduction at 1 year and 2 years, and external rotation at 3-6 months. In terms of MAE, we found good results in both groups, similar to or better than those of internal validation.

  ## Discussion

  The primary endpoint of our study was to externally validate a specific prediction tool in rTSA. We calculated the difference between expected and postoperative average values of the 2 groups and the MAE considering every patient at every time point. Regarding the difference between mean values, we found the best accuracy in VAS and active forward flexion prediction, as well as for internal rotation, despite the lack of a recognized MCID; our results are consistent with previous literature.[4],[9],[11],[17],[18]

  The MAE results for both groups are certainly encouraging, as they are lower than those of the internal validation. We found a MAE similar to, lower than, or markedly lower (up to 60.9% for VAS at 1 year in group 2) compared to that of the internal validation study. Simmons et al, in an external validation of the same tool (only for the Equinoxe implant, group 1), found similar good results regarding MAE.[19]

  Another study[20] assessed the possibility that a surgeon might change the surgical indication (rTSA vs. anatomic total shoulder arthroplasty) after consulting a Clinical Decision Support Tool: we did not evaluate this aspect, but we believe that this tool may be more patient-oriented than surgeon-oriented, precisely because of the prevalence of pessimistic rather than optimistic predictions.

  We also compared the accuracy of predictions for Equinoxe implants, for which the tool was developed, with the accuracy of predictions for a different implant by another company. We did not find significant differences in the accuracy of predictions, possibly because the 19 input parameters used affect outputs the same way with a different implant.[12] The observation of a MAE in group 2 (Zimmer Biomet Comprehensive), similar to that of group 1 (Exactech Equinoxe), and comparable to or lower than previous internal and external validations is, in our opinion, a significant result.[10],[12],[19] This is the first study where the Predict+ tool has been used for an implant for which it was not trained, and we can say that the tool gave similar results in predicting functional outcomes even when used for an implant from a different company and with different characteristics: Exactech Equinoxe is classified as a lateralized humerus/medialized glenoid implant, while Zimmer Biomet Comprehensive is classified as a lateralized humerus/lateralized glenoid implant.[23] In addition, we didn't find significant differences in postoperative results between the 2 groups.

  Preoperative ROM is the primary determinant of postoperative ROM, particularly for active anterior flexion.[1], [2], [3],[8] Postoperative external and internal rotation is also determined by factors not considered by the tool, such as teres minor atrophy (for external rotation)[3] or greater tuberosity distalization (for functional internal rotation)[8] his could explain why we found better results in aFE predictions.

  In the near future, predictions based on preoperative parameters may be integrated with intraoperative data collected by computer-assisted surgery tools and with apps able to quantify a patient's ROM reproducibly and with tools that classify preoperative and postoperative radiographs (already validated).[24] The better quality of the data provided will improve the training phase of machine learning tools and their accuracy. However, a recent study on complications after rTSA stated that patient-specific risk factors (those counted by our tool) are more strictly associated with complications rate than implant design and surgical technique.[14]

  The main strength of our study is the comparison, for the first time, between the predictions for 2 different prosthetic implants, which furthermore gave similar and reliable results even though the tool was not trained on the implant used in group 2.

  As for the limitations, our analysis was carried out on a limited patient cohort, and due to its retrospective nature, we could only study the outcomes that were constantly present in our outpatient visits (VAS and active range of motion). Moreover, due to the short duration of our follow-up (no more than 2 years), we could not fully utilize Predict+, which provides predictions for up to 7 years. Another limitation is that the sample size of the 2 groups was different (50 vs. 40), and there were differences in the timing of the first postoperative visit. However, all patients had 1 visit within the 3-6 month range.

  ## Conclusion

  In our experience, Predict+ provided similar or better results compared to previous literature for VAS and active range of motion predictions after rTSA, even for an implant which was not used during the training phase of the outcome prediction tool. In our opinion, the tool can be advantageous in managing patient expectations and enhancing adherence to rehabilitation protocols. Further investigations are needed to externally validate this tool, and its accuracy can be further increased with the aid of other machine learning–based programs.

