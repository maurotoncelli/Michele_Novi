slug: 'Volar PEEK plate for distal radius fracture: analysis of adverse events'
titolo: 'Volar PEEK plate for distal radius fracture: analysis of adverse events'
titoloBreve:
  it: 'Placca volare in PEEK nelle fratture di radio distale: analisi delle complicanze'
  en: 'Volar CFR-PEEK plate for distal radius fractures: adverse events analysis'
autori: 'Luigi Tarallo, Andrea Giorgini, Michele Novi, Francesco Zambianchi, Giuseppe Porcellini, Fabio Catani'
rivista: 'European Journal of Orthopaedic Surgery & Traumatology'
anno: 2020
volume: '30(7):1293–1298'
doi: '10.1007/s00590-020-02701-7'
pubmedId: '32435847'
abstract: |
  BACKGROUND: The aim of the present retrospective study was to evaluate complications following carbon-fiber-reinforced polyetheretherketone (CFR-PEEK) volar plating in distal radius fracture in a large cohort of patients. As an alternative to conventional metallic devices, CFR-PEEK plates have been introduced over the last few years. METHODS: We performed a retrospective study including all patients who were treated for distal radius fracture using a volar fixed-angle plate DiPHOS-RM. All CFR-PEEK plates implanted were reviewed between May 2012 and December 2017. Plate removal, second surgery and adverse events were collected by reviewing medical records. A total of 110 patients were included with a mean follow-up of 4 years. RESULTS: Adverse side effects were observed in 9 cases (8%), developed during or after treatment. The most frequent complication was represented by intraoperative plate rupture (4%). Infection was reported in one case. DISCUSSION: The rate of complications of PEEK volar plates seems to be similar to those occurring with plates of different materials. Advantages of PEEK plates are the absence of the cold-welding phenomenon and the absence of exuberant bone callus on the plate, ensuring an easy hardware removal. Intraoperative rupture remains the main complication correlated with PEEK material. These complications can be reduced with an accurate surgical technique, especially at the beginning of the learning curve.
riassunto:
  it: 'Analisi retrospettiva su 110 pazienti operati per frattura del polso (radio distale) con placca volare in fibra di carbonio-PEEK a 4 anni di follow-up medio: tasso di complicanze sovrapponibile alle placche metalliche, con vantaggi di radiotrasparenza e rimozione più agevole.'
  en: 'Retrospective analysis of 110 patients treated for distal radius fracture with a carbon-fibre-reinforced PEEK volar plate at 4-year mean follow-up: complication rates comparable to metallic plates, with advantages in radiolucency and ease of hardware removal.'
