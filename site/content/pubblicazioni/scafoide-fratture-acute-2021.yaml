riassunto:
  it: 'Lo scafoide è un piccolo osso del polso che guarisce male se trascurato. La revisione riassume come riconoscere la frattura, quando basta il gesso e quando conviene fissarla con una vite.'
  en: 'The scaphoid is a small wrist bone that heals poorly if neglected. The review summarises how to recognise the fracture, when a cast is enough and when fixing it with a screw is preferable.'
