slug: 'Different patterns of neurogenic quadrilateral space syndrome: a case series of undefined posterior shoulder pain'
titolo: 'Different patterns of neurogenic quadrilateral space syndrome: a case series of undefined posterior shoulder pain'
titoloBreve:
  it: 'Sindrome dello spazio quadrilatero: una causa rara di dolore posteriore alla spalla'
  en: 'Neurogenic quadrilateral space syndrome and unexplained posterior shoulder pain'
autori: 'Giuseppe Porcellini, Alberto Brigo, Michele Novi, Elisa De Santis, Silvia Di Giacomo, Andrea Giorgini, Gian Mario Micheloni, Rocco Bonfatti, Alessandro Donà, Luigi Tarallo'
rivista: 'Journal of Orthopaedics and Traumatology'
