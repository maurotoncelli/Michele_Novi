slug: 'Advantages of preoperative planning using computed tomography scan for treatment of malleolar ankle fractures'
titolo: 'Advantages of preoperative planning using computed tomography scan for treatment of malleolar ankle fractures'
titoloBreve:
  it: 'Vantaggi della pianificazione TC nelle fratture malleolari della caviglia'
  en: 'Preoperative CT planning in malleolar ankle fractures'
autori: 'Luigi Tarallo, Gian Mario Micheloni, Michele Mazzi, Arturo Rebeccato, Michele Novi, Fabio Catani'
rivista: 'World Journal of Orthopedics'
anno: 2021
volume: '12(3):129–139'
doi: '10.5312/wjo.v12.i3.129'
pubmedId: '33816140'
url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC7995337/'
abstract: |
  Malleolar ankle fractures have been classified using plain radiographs, and there is no consensus regarding the role of computed tomography (CT) scans in preoperative planning. We analyzed critical aspects, such as limits of standard radiographs, types of injury, classification methods and cost/benefit evaluations. CT scans allow a 3D analysis of the fracture to be obtained and consequently assess the indication for surgical procedure, surgical access and the type of fixation devices required. This exam is useful for detecting lesions that may go unnoticed on radiographs and will help surgeons to clarify the pathoanatomy of ankle fractures. According to Arbeitsgemeinschaft fur Osteosynthesefragen / Orthopaedic Trauma Association (AO/OTA) classification, CT scan is recommended in medial malleolar fractures with vertical rim, type 44B fractures with posterior malleolar involvement and all type 44C fractures. Also Tillaux-Chaput fractures, malleolar fractures in the presence of distal tibial fractures and distal tibia fractures in adolescents should be studied with CT scans.
riassunto:
  it: 'Analisi critica del ruolo della TC nella pianificazione preoperatoria delle fratture malleolari di caviglia: quando le radiografie standard non bastano e in quali quadri di frattura la TC 3D cambia accesso chirurgico e scelta dei mezzi di sintesi.'
  en: 'Critical review of the role of CT scans in preoperative planning for malleolar ankle fractures: when plain X-rays are insufficient and which fracture patterns benefit from 3D CT assessment to guide surgical approach and fixation.'
