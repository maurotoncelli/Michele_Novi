slug: 'Treatment of flexor tendon reconstruction failures: multicentric experience with Brunelli active tendon implant'
titolo: 'Treatment of flexor tendon reconstruction failures: multicentric experience with Brunelli active tendon implant'
titoloBreve:
  it: 'Ricostruzione dei tendini flessori della mano con impianto tendineo attivo di Brunelli'
  en: 'Multicentric experience with the Brunelli active tendon implant in failed flexor tendon repairs'
autori: 'Andrea Poggetti, Michele Novi, Marco Rosati, Davide Ciclamini, Michelangelo Scaglione, Bruno Battiston'
rivista: 'European Journal of Orthopaedic Surgery & Traumatology'
anno: 2018
volume: '28(5):877–883'
doi: '10.1007/s00590-017-2102-x'
pubmedId: '29218649'
abstract: |
  INTRODUCTION: Secondary repair of flexor tendon injuries remains a challenging procedure for hand surgeons. Usually, secondary reconstruction should be performed by a staged approach. When the tendon and pulley integrity are intact, tenolysis may be the first surgical option. One-/two-stage tendon grafts are suggested when the integrity of the flexor tendon is compromised. Active tendon implants (Brunelli prostheses) may represent an efficient option in patients with a poor prognosis, as well as whenever classical techniques fail. Due to lack of literature about this second-line treatment, the authors present the experience of two different orthopedic departments with the permanent active tendon implant. MATERIALS AND METHOD: Nineteen consecutive patients with failed previous flexor tendon repairs were treated with active tendon implants between 2000 and 2011. The functional outcome of the patients was examined with a mean follow-up of 5.6 years, using Strickland assessment and QuickDASH. RESULTS: In 16 cases, the tendon implants were well tolerated and patients resulted satisfied with a QuickDASH score less than 33. Strickland score was fair to excellent in 10 patients. We registered adhesion complications in 3 cases. CONCLUSION: These prostheses represent an alternative to biological reconstructions and a potentially permanent procedure in complicated flexor tendon injuries.
riassunto:
  it: 'Esperienza multicentrica su 19 pazienti con esiti complessi di lesioni dei tendini flessori della mano già operati senza successo: l''impianto tendineo attivo di Brunelli offre una valida alternativa ricostruttiva a oltre 5 anni di follow-up medio.'
  en: 'Multicentric study of 19 patients with complex failed flexor tendon repairs of the hand: the Brunelli active tendon implant provides a viable reconstructive alternative at over 5 years of mean follow-up.'
