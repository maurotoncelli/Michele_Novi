slug: 'Ultrasound-Guided Percutaneous Long Head of Biceps Tenotomy: A Safe and Effective Treatment in Elderly'
titolo: 'Ultrasound-Guided Percutaneous Long Head of Biceps Tenotomy: A Safe and Effective Treatment in Elderly'
titoloBreve:
  it: 'Tenotomia ecoguidata del capo lungo del bicipite nel paziente anziano'
  en: 'Ultrasound-guided percutaneous long head of biceps tenotomy in elderly patients'
autori: 'Stefano Carli, Michele Novi, Raffaele Scialla, Mario Guerrisi, Matteo Paci, Stefano Gumina, Simone Nicoletti'
rivista: 'Muscles, Ligaments and Tendons Journal'
anno: 2024
volume: '14(3)'
doi: '10.32098/mltj.03.2024.04'
pubmedId: ''
abstract: |
  Introduction. Patients with painful shoulder and long head of the biceps (LHB) tendinopathy are candidates for shoulder arthroscopy or other major procedures. However, for patients with comorbidities or to old, a minimally invasive LHB tenotomy may be indicated. We describe the outcomes of ultrasound-assisted LHB tenotomy performed under local anesthesia. Materials and methods. Between 2015 and 2020, 33 patients underwent echo-guided tenotomy surgery. Inclusion criteria were painful shoulder without pseudo paralysis, intact LHB, and inability or refusal to major surgery. Under ultrasound guidance, the LHB is located and fixed with a 18G needle at the proximal biceps groove. After local anesthesia, a mini-open tenotomy is performed. Both a Quick Disabilities of the Arm, Shoulder, and Hand (QuickDASH) score and pain on the visual analog scale (VAS) were recorded at baseline and at follow-up. Satisfaction (1 to 5) and adverse events were recorded. Results. Among the 33 eligible patients, 7 were lost at follow-up. The 26 (of which 17 women) patients enrolled had a median age of 76.5 years (IQR = 7). Mean follow-up was 39.5 months (range 8-63). Median QuickDASH changed from 67.1 to 21.6. Median VAS score before and after tenotomy was 8.5 and 3.5 respectively. Mean satisfaction score was 4.1. We recorded 7 Popeye deformities and 6 hematomas. Four patients presented with cramps and 6 reported a reduction of strength. Only 4/26 would not undergo the procedure again. Conclusions. The ultrasound-assisted LHB tenotomy was confirmed as a reliable and safe.
riassunto:
  it: 'In 26 pazienti (età mediana 76,5 anni) che non potevano o non volevano affrontare un intervento maggiore, la tenotomia del capo lungo del bicipite sotto guida ecografica, in anestesia locale, ha portato il dolore mediano (VAS) da 8,5 a 3,5 e il QuickDASH mediano da 67,1 a 21,6, con un follow-up medio di 39,5 mesi. Tra gli eventi registrati, 7 deformità «di Popeye» e 6 ematomi. Gli autori giudicano la procedura affidabile e sicura.'
  en: 'In 26 patients (median age 76.5 years) unable or unwilling to undergo major surgery, ultrasound-assisted tenotomy of the long head of the biceps under local anaesthesia took median pain (VAS) from 8.5 to 3.5 and median QuickDASH from 67.1 to 21.6, at a mean follow-up of 39.5 months. Recorded events included 7 Popeye deformities and 6 haematomas. The authors consider the procedure reliable and safe.'
