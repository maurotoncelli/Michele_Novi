slug: 'Ultrasound-Guided Percutaneous Long Head of Biceps Tenotomy: A Safe and Effective Treatment in Elderly'
titolo: 'Ultrasound-Guided Percutaneous Long Head of Biceps Tenotomy: A Safe and Effective Treatment in Elderly'
titoloBreve:
  it: 'Tenotomia ecoguidata del capo lungo del bicipite nel paziente anziano'
  en: 'Ultrasound-guided percutaneous long head of biceps tenotomy in elderly patients'
autori: 'Stefano Carli, Michele Novi, Raffaele Scialla, Mario Guerrisi, Matteo Paci, Stefano Gumina, Simone Nicoletti'
rivista: 'Muscles, Ligaments and Tendons Journal'
anno: 2024
volume: '14(3)'
doi: '10.32098/mltj.03.2024.04'
pubmedId: ''
abstract: |
  Introduction: Patients with painful shoulder and long head of the biceps (LHB) tendinopathy are candidates for shoulder arthroscopy or other major procedures. However, for patients with comorbidities or advanced age, a minimally invasive LHB tenotomy may be indicated. We describe the outcomes of ultrasound-assisted LHB tenotomy performed under local anesthesia. Materials and methods: Between 2015 and 2020, 33 patients underwent echo-guided tenotomy surgery. Inclusion criteria were painful shoulder without pseudoparalysis, intact LHB, and inability or refusal to undergo major surgery. Under ultrasound guidance, the LHB is located and fixed with an 18G needle at the proximal biceps groove. After local anesthesia, a mini-open tenotomy is performed. Both a Quick Disabilities of the Arm, Shoulder, and Hand (QuickDASH) score and pain on the visual analog scale (VAS) were recorded at baseline and at follow-up. Satisfaction (1 to 5) and adverse events were recorded. Results: Among the 33 eligible patients, 7 were lost at follow-up. The 26 (of which 17 women) patients enrolled had a median age of 76.5 years (IQR = 7). Mean follow-up was 39.5 months (range 8–63). Median QuickDASH changed from 67.1 to 21.6. Median VAS score before and after tenotomy was 8.5 and 3.5 respectively. Mean satisfaction score was 4.1. We recorded 7 Popeye deformities and 6 hematomas. Four patients presented with cramps and 6 reported a reduction of strength. Only 4/26 would not undergo the procedure again. Conclusions: Ultrasound-assisted LHB tenotomy was confirmed as a reliable and safe procedure.
riassunto:
  it: 'Nei pazienti anziani o con comorbidità che non possono affrontare un intervento maggiore, la tenotomia del capo lungo del bicipite guidata dall''ecografia in anestesia locale riduce sensibilmente il dolore alla spalla e migliora la funzionalità con una procedura mininvasiva sicura.'
  en: 'In elderly patients or those with comorbidities unsuitable for major surgery, ultrasound-guided long head of biceps tenotomy under local anaesthesia significantly reduces shoulder pain and improves function through a safe, minimally invasive procedure.'
