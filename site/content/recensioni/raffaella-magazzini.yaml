nome: Raffaella Magazzini
testo:
  it: 'A causa del mio problema ho girato diversi dottori, ma il dott. Novi è stato l''unico che mi ha visitata e ha curato in ogni dettaglio il mio problema. Molto attento e scrupoloso, con tante spiegazioni riguardo il dolore che ho ormai da quasi un anno. Molto professionale, lo consiglio.'
  en: 'I had seen several doctors for my problem, but Dr Novi was the only one who examined me and looked after every detail. Very attentive and thorough, with many explanations about pain I have had for almost a year. Very professional — I recommend him.'
