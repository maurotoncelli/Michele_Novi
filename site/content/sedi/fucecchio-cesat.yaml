ruolo:
  it: >-
    Qui lavoro come dirigente medico della SOC Ortopedia Protesica, ASL Toscana Centro. È la sede degli interventi
    in regime pubblico: protesi di spalla, chirurgia artroscopica e traumatologia dell'arto superiore, oltre alla
    protesica di anca e ginocchio. La degenza per gli interventi in SSN non ha costi per il paziente.
  en: >-
    Here I work as a consultant in the Joint Replacement Unit of the Tuscany Central Health Authority. This is where
    surgery under the public system takes place: shoulder replacement, arthroscopic surgery and upper-limb trauma,
    as well as hip and knee replacement. Admission for NHS procedures has no cost for the patient.
comeArrivare:
  it: L'ospedale è in centro a Fucecchio, sulla piazza principale. Dalla FI-PI-LI uscita San Miniato / Fucecchio.
  en: The hospital is in the centre of Fucecchio, on the main square. From the FI-PI-LI motorway take the San Miniato / Fucecchio exit.
accessibilita:
  it: Ingresso accessibile. Parcheggi pubblici nelle vie intorno alla piazza.
  en: Accessible entrance. Public parking in the streets around the square.
